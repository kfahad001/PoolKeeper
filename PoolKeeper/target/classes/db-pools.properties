# =============================================================================
# Connection pool definitions - one block per pool, keyed as <poolName>.<field>
#
# TO ONBOARD A NEW DATABASE: copy a block below, change the values. That's it.
# No Java code changes needed, AS LONG AS the vendor you need already has a
# DbVendor enum entry (MYSQL / POSTGRES / ORACLE / SQL_SERVER / H2_MEM already
# do). A genuinely new DB *type* the app has never talked to is the one case
# that still needs a one-time DbVendor enum addition + its driver dependency
# in pom.xml - see DbVendor.java.
#
# Fields:
#   vendor              - one of the DbVendor enum names (required)
#   host, port, dbName   - used to build the JDBC URL via DbVendor.buildUrl()
#   jdbcUrl              - OPTIONAL escape hatch: set this instead of
#                          host/port/dbName to supply the full URL directly
#                          (e.g. extra driver params a vendor's template
#                          doesn't cover)
#   username, password   - password supports ${ENV_VAR} or ${ENV_VAR:default}
#                          to pull secrets from environment variables instead
#                          of hardcoding them in this file
#   maxPoolSize, minIdle, connectionTimeoutMs, idleTimeoutMs, maxLifetimeMs
#                        - all optional; DbConfig.Builder defaults apply if
#                          omitted (see DbConfig.java)
# =============================================================================

# --- orders-db: primary OLTP database ---
orders-db.vendor=H2_MEM
orders-db.host=localhost
orders-db.port=0
orders-db.dbName=ordersdb
orders-db.username=sa
orders-db.password=
orders-db.maxPoolSize=5
orders-db.minIdle=1

# --- reporting-db: separate DB, smaller pool, longer idle timeout is fine ---
reporting-db.vendor=H2_MEM
reporting-db.host=localhost
reporting-db.port=0
reporting-db.dbName=reportingdb
reporting-db.username=sa
reporting-db.password=
reporting-db.maxPoolSize=3
reporting-db.minIdle=1
reporting-db.idleTimeoutMs=900000

# -----------------------------------------------------------------------------
# Real-world example (commented out) - this is literally all it takes to
# onboard a production Postgres DB once the postgresql driver dependency is
# uncommented in pom.xml:
#
# payments-db.vendor=POSTGRES
# payments-db.host=payments-db.internal
# payments-db.port=5432
# payments-db.dbName=payments
# payments-db.username=app_user
# payments-db.password=${PAYMENTS_DB_PASSWORD}
# payments-db.maxPoolSize=20
# payments-db.minIdle=5
# payments-db.connectionTimeoutMs=20000
#
# Or with a fully custom JDBC URL instead of host/port/dbName:
#
# legacy-db.vendor=ORACLE
# legacy-db.jdbcUrl=jdbc:oracle:thin:@//legacy-host:1521/LEGACYSVC?oracle.net.CONNECT_TIMEOUT=5000
# legacy-db.username=legacy_user
# legacy-db.password=${LEGACY_DB_PASSWORD}
# legacy-db.maxPoolSize=8
# -----------------------------------------------------------------------------
